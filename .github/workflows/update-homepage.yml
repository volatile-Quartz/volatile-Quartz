name: Update Homepage README

# 统一驱动主页各区块的动态数据：
#   周记(fetch_diary) / 草稿纸(fetch_releases) / 记录条目(fetch_issues) / WhatPulse(fetch_whatpulse)
# 音乐（Last.fm）由 update-lastfm.yml 单独每周更新。
#
# 频率：每周一次（周一 03:00 UTC）。这些都是慢变量，且改动不频繁；
# 需要立刻刷新时用 workflow_dispatch 手动触发。

on:
  schedule:
    - cron: '0 3 * * 1'      # 每周一 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 2

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'

    - name: Run fetch scripts
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 读 issue / releases，避免匿名限流
      run: |
        node fetch_diary.js
        node fetch_releases.js
        node fetch_issues.js
        node fetch_whatpulse.js

    - name: Commit and push changes
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com
        git add README.md

        if git diff --staged --quiet; then
          echo "No changes to README.md, skipping commit."
          exit 0
        fi

        HEAD_AUTHOR=$(git log -1 --format="%an")
        HEAD_EMAIL=$(git log -1 --format="%ae")
        PARENT_COUNT=$(git log -1 --format="%P" | wc -w)
        echo "HEAD author=$HEAD_AUTHOR email=$HEAD_EMAIL parent_count=$PARENT_COUNT"

        if [ "$HEAD_AUTHOR" = "github-actions" ] && [ "$HEAD_EMAIL" = "github-actions@github.com" ] && [ "$PARENT_COUNT" -ge 1 ]; then
          echo "HEAD is previous bot commit with parent → amending"
          git commit --amend --no-edit
          git push --force-with-lease
        else
          echo "HEAD is human commit or no parent → creating new bot commit"
          git commit -m "chore: update homepage data (diary / releases / issues / whatpulse)"
          git push
        fi