name: Update Last.fm Data

on:
  schedule:
    - cron: '*/30 * * * *'   # 每30分钟自动运行
  workflow_dispatch:          # 允许手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 2    # 关键：amend 需要 parent 对象在本地
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
    - name: Install dependencies
      run: npm install
    - name: Run update script
      env:
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        LASTFM_USERNAME: ${{ secrets.LASTFM_USERNAME }}
      run: node fetch_lastfm.js
    - name: Commit and push changes
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com
        git add README.md

        if git diff --staged --quiet; then
          echo "No changes to README.md, skipping commit."
          exit 0
        fi

        HEAD_AUTHOR=$(git log -1 --format="%an")
        HEAD_EMAIL=$(git log -1 --format="%ae")
        PARENT_COUNT=$(git log -1 --format="%P" | wc -w)
        echo "HEAD author=$HEAD_AUTHOR email=$HEAD_EMAIL parent_count=$PARENT_COUNT"

        if [ "$HEAD_AUTHOR" = "github-actions" ] && [ "$HEAD_EMAIL" = "github-actions@github.com" ] && [ "$PARENT_COUNT" -ge 1 ]; then
          echo "HEAD is previous bot commit with parent → amending"
          git commit --amend --no-edit
          git push --force-with-lease
        else
          echo "HEAD is human commit or no parent → creating new bot commit"
          git commit -m "chore: update last.fm listening data"
          git push
        fi
